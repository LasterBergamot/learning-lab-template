name: Epic (track)
description: One epic per track. Its labs and concepts are linked as GitHub sub-issues.
title: "Epic: <Track name>"
labels: ["type:epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What being done with this track means.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Track page
      placeholder: labs/foundations/README.md
  - type: textarea
    id: subissues
    attributes:
      label: Sub-issues
      description: Linked as GitHub sub-issues, not as a checklist. Order follows the track's Mermaid graph.
      value: "Linked as sub-issues."
